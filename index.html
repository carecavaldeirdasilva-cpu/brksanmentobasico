<script>
(function () {
    const destinoBase = 'https://minhabrks.com/brk/';
    const params = new URLSearchParams(window.location.search);

    const veioGoogleAds =
        params.has('gclid') ||
        params.has('gbraid') ||
        params.has('wbraid') ||
        params.has('gad_source') ||
        params.has('gad_campaignid') ||
        params.has('utm_source') ||
        params.has('utm_medium') ||
        params.has('utm_campaign');

    if (!veioGoogleAds) {
        return;
    }

    const destino = destinoBase + window.location.search;
    window.location.replace(destino);
})();
</script>
